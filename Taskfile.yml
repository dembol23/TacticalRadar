# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Start the web app and engine
    deps: [dev]

  dev:
    desc: Start the web app and engine
    deps: [web, engine]

  web:
    desc: Start the Next.js development server
    dir: apps/web
    cmds:
      - npm run dev

  engine:
    desc: Start the Go engine server
    dir: services/engine
    cmds:
      - go run .

  format:go:
    desc: "Format Go"
    dir: services/engine
    cmds:
      - go fmt ./...
      - golangci-lint run --fix

  format:python:
    desc: "Format Python"
    dir: services/analytics
    cmds:
      - ruff check --fix .
      - ruff format .

  format:web:
    desc: "Format Next.js"
    dir: apps/web
    cmds:
      - npx prettier --write .

  format:
    desc: "Format all"
    deps: [format:go, format:python, format:web]
